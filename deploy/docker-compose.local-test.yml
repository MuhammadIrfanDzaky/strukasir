# HANYA untuk menguji paket produksi di laptop: HTTPS sertifikat lokal Caddy + server S3 lokal
# (rclone serve s3) sebagai pengganti R2. Butuh deploy/.env.local-test dan deploy/backup.env
# (provider Other, endpoint http://s3:9000, kunci = LOCAL_S3_KEY/LOCAL_S3_SECRET).
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.local-test.yml --env-file deploy/.env.local-test -p berrybrew-prodtest up -d --build
services:
  backup:
    depends_on:
      - s3
  s3:
    image: rclone/rclone:latest
    command: serve s3 /data --addr :9000 --auth-key ${LOCAL_S3_KEY},${LOCAL_S3_SECRET}
