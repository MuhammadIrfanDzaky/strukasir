# Produksi (VPS Ubuntu + Docker). Dari root repo:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: strukasir

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: berrybrew
      DB_USERNAME: berrybrew_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data        # sertifikat TLS — jangan dihapus
      - caddy_config:/config
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Tugas terjadwal Laravel (cek tagihan paket ke Mayar tiap 5 menit). Image sama dengan app, tanpa port.
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: berrybrew
      DB_USERNAME: berrybrew_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d berrybrew"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    # Tidak ada port yang dibuka ke internet.

  backup:
    build: ./backup
    # Tujuan backup (R2/S3 atau Google Drive) diatur di backup.env — lihat backup.env.*.example.
    env_file: backup.env
    environment:
      TZ: Asia/Jakarta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
